<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>FRX Pixel Wars | 自由極速畫布</title>
    
    <link rel="icon" href="https://i.ibb.co/G4FNMK2M/photo-output.webp" type="image/webp">
    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.85);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.65);
            --primary-accent: #3b82f6;
        }

        body {
            margin: 0;
            background-color: #070709;
            color: #f1f1f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-top {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: auto;
            padding: 8px 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        h1 { margin: 0; font-size: 14px; letter-spacing: 1px; font-weight: 700; color: #ffffff; }
        p { margin: 2px 0 0 0; font-size: 11px; color: #10b981; font-weight: 600; }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #canvas-wrapper {
            position: absolute;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            background-color: #ffffff;
            transform-origin: 0 0;
            border-radius: 4px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 94%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .tool-bar {
            display: flex;
            gap: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid transparent;
            color: #fff;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .tool-btn.active {
            background: var(--primary-accent);
            border-color: #60a5fa;
            font-weight: bold;
        }

        .palette {
            display: flex;
            gap: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            padding: 10px 16px;
            border-radius: 35px;
            box-shadow: var(--glass-shadow);
            align-items: center;
            border: 1px solid var(--glass-border);
            overflow-x: auto;
            max-width: 100%;
            scrollbar-width: none;
        }
        .palette::-webkit-scrollbar { display: none; }

        .color-btn {
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            box-sizing: border-box;
        }
        .color-btn.active {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255,255,255,0.8);
        }
        
        .color-custom-label {
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff00ff, #ff0000);
            display: block;
        }
        #custom-color-picker { display: none; }

        #stamp-panel {
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 16px;
            z-index: 30;
            width: 210px;
            box-shadow: var(--glass-shadow);
            font-size: 12px;
        }
        #stamp-panel h3 { margin: 0 0 10px 0; font-size: 14px; color: #fff; }
        .control-group { margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
        .control-group label { color: #94a3b8; }
        .control-group input[type="range"] { width: 100%; }
        .stamp-action-btn {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: #22c55e;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }
        .stamp-cancel-btn {
            width: 100%;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: #ef4444;
            cursor: pointer;
            margin-top: 4px;
        }

        .floating-buttons {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .float-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            cursor: pointer;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div id="ui-top">
        <h1>FRX Pixel Wars</h1>
        <p id="status-text">⚡ 畫布載入中...</p>
    </div>

    <div class="floating-buttons">
        <button class="float-btn" onclick="centerCanvas()" title="重置視角">🎯</button>
    </div>

    <div id="stamp-panel">
        <h3>印章尺寸與放置</h3>
        <div class="control-group">
            <label>圖片寬度: <span id="stamp-w-val">50</span> px</label>
            <input type="range" id="stamp-width" min="5" max="300" value="50">
        </div>
        <div class="control-group">
            <label>圖片高度: <span id="stamp-h-val">50</span> px</label>
            <input type="range" id="stamp-height" min="5" max="300" value="50">
        </div>
        <button class="stamp-action-btn" onclick="applyStamp()">直接蓋章下去！</button>
        <button class="stamp-cancel-btn" onclick="cancelStamp()">取消圖片</button>
    </div>

    <div id="viewport">
        <div id="canvas-wrapper">
            <canvas id="pixelCanvas"></canvas>
            <canvas id="previewCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
        </div>
    </div>

    <div id="ui-bottom">
        <div class="tool-bar">
            <button class="tool-btn active" id="mode-draw" onclick="switchMode('draw')">✏️ 塗鴉筆刷</button>
            <button class="tool-btn" id="mode-pan" onclick="switchMode('pan')">✋ 拖動視角</button>
            <button class="tool-btn" onclick="document.getElementById('image-uploader').click()">🖼️ 上傳圖片蓋章</button>
            <input type="file" id="image-uploader" accept="image/*" style="display:none;">
        </div>

        <div class="palette" id="palette">
            <div class="color-btn active" style="background-color: #000000;" data-color="#000000"></div>
            <div class="color-btn" style="background-color: #ffffff;" data-color="#ffffff"></div>
            <div class="color-btn" style="background-color: #ff0000;" data-color="#ff0000"></div>
            <div class="color-btn" style="background-color: #00ff00;" data-color="#00ff00"></div>
            <div class="color-btn" style="background-color: #0055ff;" data-color="#0055ff"></div>
            <div class="color-btn" style="background-color: #ffff00;" data-color="#ffff00"></div>
            <div class="color-btn" style="background-color: #ff00ff;" data-color="#ff00ff"></div>
            <div class="color-btn" style="background-color: #00ffff;" data-color="#00ffff"></div>
            <div class="color-btn" style="background-color: #ff7700;" data-color="#ff7700"></div>
            <div class="color-btn" style="background-color: #8b00ff;" data-color="#8b00ff"></div>
            
            <label class="color-custom-label" id="custom-color-label" for="custom-color-picker"></label>
            <input type="color" id="custom-color-picker" value="#ff0000">
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCTZb5Fphxpr_54XBWbrIzyW5uspJzhwak",
            authDomain: "frx67-2a892.firebaseapp.com",
            projectId: "frx67-2a892",
            storageBucket: "frx67-2a892.firebasestorage.app",
            messagingSenderId: "294732115344",
            appId: "1:294732115344:web:5fa6b8f2a6d86b2dfe1715",
            measurementId: "G-5CECYP5JYK",
            databaseURL: "https://frx67-2a892-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const pixelsRef = db.ref('pixels');

        let currentUser = null;
        auth.signInAnonymously().catch(console.error);
        auth.onAuthStateChanged(user => { currentUser = user; });

        const viewport = document.getElementById('viewport');
        const wrapper = document.getElementById('canvas-wrapper');
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const previewCanvas = document.getElementById('previewCanvas');
        const pCtx = previewCanvas.getContext('2d');

        const MAP_SIZE = 500; 
        const CELL_SIZE = 10;

        wrapper.style.width = (MAP_SIZE * CELL_SIZE) + 'px';
        wrapper.style.height = (MAP_SIZE * CELL_SIZE) + 'px';
        canvas.width = MAP_SIZE;
        canvas.height = MAP_SIZE;
        previewCanvas.width = MAP_SIZE;
        previewCanvas.height = MAP_SIZE;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

        let scale = 1, offsetX = 0, offsetY = 0;
        let isMouseDown = false;
        let selectedColor = '#000000';
        let currentMode = 'draw'; 
        const localMap = {}; 
        let pendingWrites = {};

        let stampImage = null;
        let stampX = 150, stampY = 150, stampW = 50, stampH = 50;

        let renderScheduled = false;
        function scheduleRender() {
            if (!renderScheduled) {
                renderScheduled = true;
                requestAnimationFrame(() => {
                    renderScheduled = false;
                    render();
                });
            }
        }

        function centerCanvas() {
            scale = Math.min(window.innerWidth, window.innerHeight) / (MAP_SIZE * CELL_SIZE) * 0.9;
            offsetX = (window.innerWidth - (MAP_SIZE * CELL_SIZE) * scale) / 2;
            offsetY = (window.innerHeight - (MAP_SIZE * CELL_SIZE) * scale) / 2;
            scheduleRender();
        }

        function render() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
            for (let key in localMap) {
                const commaIdx = key.indexOf(',');
                const x = parseInt(key.substring(0, commaIdx));
                const y = parseInt(key.substring(commaIdx + 1));
                ctx.fillStyle = localMap[key];
                ctx.fillRect(x, y, 1, 1);
            }
            wrapper.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            renderPreview();
        }

        function renderPreview() {
            pCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
            if (currentMode === 'stamp' && stampImage) {
                pCtx.globalAlpha = 0.7;
                pCtx.drawImage(stampImage, stampX, stampY, stampW, stampH);
                pCtx.strokeStyle = '#3b82f6';
                pCtx.lineWidth = 1;
                pCtx.strokeRect(stampX, stampY, stampW, stampH);
            }
        }

        pixelsRef.once('value', snap => {
            const data = snap.val();
            if (data) {
                for (let k in data) {
                    const cleanKey = k.replace('x', '').replace('y', '').replace('_', ',');
                    localMap[cleanKey] = data[k].color;
                }
            }
            document.getElementById('status-text').innerText = "⚡ 自由模式：就緒";
            scheduleRender();
        });

        pixelsRef.on('child_changed', snap => {
            const cleanKey = snap.key.replace('x', '').replace('y', '').replace('_', ',');
            localMap[cleanKey] = snap.val().color;
            scheduleRender();
        });

        setInterval(() => {
            if (Object.keys(pendingWrites).length > 0) {
                db.ref().update(pendingWrites);
                pendingWrites = {};
            }
        }, 100);

        function placePixel(x, y) {
            if (x < 0 || x >= MAP_SIZE || y < 0 || y >= MAP_SIZE) return;
            const key = `${x},${y}`;
            if (localMap[key] === selectedColor) return;

            localMap[key] = selectedColor;
            scheduleRender();

            const dbKey = `/pixels/x${x}_y${y}`;
            const todayStr = new Date().toISOString().split('T')[0];
            pendingWrites[dbKey] = {
                color: selectedColor,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                uid: currentUser ? currentUser.uid : 'anon',
                date: todayStr
            };
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'draw') document.getElementById('mode-draw').classList.add('active');
            if(mode === 'pan') document.getElementById('mode-pan').classList.add('active');
            if(mode !== 'stamp') document.getElementById('stamp-panel').style.display = 'none';
            scheduleRender();
        }

        document.getElementById('image-uploader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    stampImage = img;
                    // 自動按原圖比例計算寬高
                    const aspect = img.height / img.width;
                    stampW = Math.min(100, img.width);
                    stampH = Math.round(stampW * aspect);

                    document.getElementById('stamp-width').value = stampW;
                    document.getElementById('stamp-height').value = stampH;
                    document.getElementById('stamp-w-val').innerText = stampW;
                    document.getElementById('stamp-h-val').innerText = stampH;
                    
                    document.getElementById('stamp-panel').style.display = 'block';
                    switchMode('stamp');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('stamp-width').addEventListener('input', (e) => {
            stampW = parseInt(e.target.value);
            document.getElementById('stamp-w-val').innerText = stampW;
            renderPreview();
        });

        document.getElementById('stamp-height').addEventListener('input', (e) => {
            stampH = parseInt(e.target.value);
            document.getElementById('stamp-h-val').innerText = stampH;
            renderPreview();
        });

        // 核心修復：100% 完整採樣與繪製 stamp 圖片
        function applyStamp() {
            if (!stampImage) return;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = stampW;
            tempCanvas.height = stampH;
            const tCtx = tempCanvas.getContext('2d');
            
            // 繪製原圖至臨時畫布
            tCtx.drawImage(stampImage, 0, 0, stampW, stampH);
            const imgData = tCtx.getImageData(0, 0, stampW, stampH).data;
            const todayStr = new Date().toISOString().split('T')[0];

            for (let y = 0; y < stampH; y++) {
                for (let x = 0; x < stampW; x++) {
                    const idx = (y * stampW + x) * 4;
                    const alpha = imgData[idx + 3];

                    // 只要非完全透明即蓋章印下
                    if (alpha > 5) { 
                        const r = imgData[idx];
                        const g = imgData[idx + 1];
                        const b = imgData[idx + 2];
                        const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
                        
                        const targetX = stampX + x;
                        const targetY = stampY + y;

                        if (targetX >= 0 && targetX < MAP_SIZE && targetY >= 0 && targetY < MAP_SIZE) {
                            localMap[`${targetX},${targetY}`] = hex;
                            pendingWrites[`/pixels/x${targetX}_y${targetY}`] = {
                                color: hex,
                                timestamp: firebase.database.ServerValue.TIMESTAMP,
                                uid: currentUser ? currentUser.uid : 'anon',
                                date: todayStr
                            };
                        }
                    }
                }
            }

            cancelStamp();
            scheduleRender();
        }

        function cancelStamp() {
            stampImage = null;
            document.getElementById('stamp-panel').style.display = 'none';
            switchMode('draw');
        }

        let lastX = 0, lastY = 0;
        function getCanvasCoords(clientX, clientY) {
            return {
                x: Math.floor((clientX - offsetX) / (scale * CELL_SIZE)),
                y: Math.floor((clientY - offsetY) / (scale * CELL_SIZE))
            };
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('#ui-bottom') || e.target.closest('#stamp-panel')) return;
            isMouseDown = true;
            lastX = e.clientX;
            lastY = e.clientY;
            const pos = getCanvasCoords(e.clientX, e.clientY);
            if (currentMode === 'draw') placePixel(pos.x, pos.y);
            else if (currentMode === 'stamp') { stampX = pos.x; stampY = pos.y; renderPreview(); }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            if (currentMode === 'pan') {
                offsetX += e.clientX - lastX;
                offsetY += e.clientY - lastY;
                scheduleRender();
            } else if (currentMode === 'draw') {
                const pos = getCanvasCoords(e.clientX, e.clientY);
                placePixel(pos.x, pos.y);
            } else if (currentMode === 'stamp') {
                const pos = getCanvasCoords(e.clientX, e.clientY);
                stampX = pos.x; stampY = pos.y; renderPreview();
            }
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => { isMouseDown = false; });

        viewport.addEventListener('touchstart', (e) => {
            if (e.target.closest('#ui-bottom') || e.target.closest('#stamp-panel')) return;
            if (e.touches.length === 1) {
                isMouseDown = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                const pos = getCanvasCoords(lastX, lastY);
                if (currentMode === 'draw') placePixel(pos.x, pos.y);
                else if (currentMode === 'stamp') { stampX = pos.x; stampY = pos.y; renderPreview(); }
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if (!isMouseDown || e.touches.length > 1) return;
            const touch = e.touches[0];
            if (currentMode === 'pan') {
                offsetX += touch.clientX - lastX;
                offsetY += touch.clientY - lastY;
                scheduleRender();
            } else if (currentMode === 'draw') {
                const pos = getCanvasCoords(touch.clientX, touch.clientY);
                placePixel(pos.x, pos.y);
            } else if (currentMode === 'stamp') {
                const pos = getCanvasCoords(touch.clientX, touch.clientY);
                stampX = pos.x; stampY = pos.y; renderPreview();
            }
            lastX = touch.clientX; lastY = touch.clientY;
        }, { passive: false });

        viewport.addEventListener('touchend', () => { isMouseDown = false; });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoom = e.deltaY < 0 ? 1.15 : 0.85;
            scale = Math.max(0.1, Math.min(scale * zoom, 20));
            scheduleRender();
        }, { passive: false });

        document.getElementById('palette').addEventListener('click', (e) => {
            if (e.target.classList.contains('color-btn')) {
                document.querySelectorAll('.color-btn, .color-custom-label').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedColor = e.target.getAttribute('data-color');
            }
        });

        document.getElementById('custom-color-picker').addEventListener('input', (e) => {
            selectedColor = e.target.value;
            document.getElementById('custom-color-label').style.background = selectedColor;
        });

        centerCanvas();
    </script>
</body>
</html>
